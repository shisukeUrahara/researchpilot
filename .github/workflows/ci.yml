name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: better-sqlite3 native binding loads
        run: node -e "new (require('better-sqlite3'))(':memory:')"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Committed passages match their checksums
        run: pnpm rp verify
      - name: Every eval run set reproduces from the replay cache with no API key
        run: pnpm rp reproduce
        env:
          OPENAI_API_KEY: ""
      - name: Release gate, critical checks (quality misses are printed and published in gate/gate.json)
        run: pnpm rp gate --eval eval-bounded --injection injection-bounded --strict eval-ablation --critical-only
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
