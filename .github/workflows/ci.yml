name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: better-sqlite3 native binding loads
        run: node -e "new (require('better-sqlite3'))(':memory:')"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Committed passages match their checksums
        run: pnpm rp verify
      - run: pnpm build
